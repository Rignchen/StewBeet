
name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        id: uv
        with:
          python-version: '3.14'
          working-directory: python_package
          activate-environment: true
      - name: Install dependencies
        run: |
          cd python_package
          source ${{ steps.uv.outputs.venv }}/bin/activate
          uv pip install .
      - name: Run tests
        run: |
          source ${{ steps.uv.outputs.venv }}/bin/activate
          stouputils all_doctests python_package
